<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.5" stop-color="#111a3a"/>
      <stop offset="1" stop-color="#0a0f22"/>
    </linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.35" stop-color="#818cf8"/>
      <stop offset="0.7" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#2dd4bf"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#818cf8" stroke-opacity="0.12" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="0 40" dur="4s" repeatCount="indefinite"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="typeclip">
      <rect x="352" y="168" height="34" width="0">
        <animate attributeName="width" values="0;300;300;0" keyTimes="0;0.3;0.88;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1000" height="320" fill="url(#bg)"/>
  <rect width="1000" height="320" fill="url(#grid)"/>

  <!-- pulsing aura -->
  <ellipse cx="500" cy="140" rx="380" ry="110" fill="url(#glow)">
    <animate attributeName="rx" values="340;420;340" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- floating particles -->
  <g fill="#2dd4bf">
    <circle cx="80" cy="320" r="2"><animate attributeName="cy" from="330" to="-10" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="320" r="3" fill="#818cf8"><animate attributeName="cy" from="330" to="-10" dur="9s" begin="-3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="320" r="2" fill="#f472b6"><animate attributeName="cy" from="330" to="-10" dur="6s" begin="-1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="390" cy="320" r="2.5"><animate attributeName="cy" from="330" to="-10" dur="8s" begin="-5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="-5s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="320" r="2" fill="#818cf8"><animate attributeName="cy" from="330" to="-10" dur="10s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="320" r="3" fill="#f472b6"><animate attributeName="cy" from="330" to="-10" dur="7.5s" begin="-4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7.5s" begin="-4s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="320" r="2"><animate attributeName="cy" from="330" to="-10" dur="6.5s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6.5s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="320" r="2.5" fill="#818cf8"><animate attributeName="cy" from="330" to="-10" dur="9s" begin="-6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="-6s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="320" r="2" fill="#f472b6"><animate attributeName="cy" from="330" to="-10" dur="8s" begin="-1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="320" r="3"><animate attributeName="cy" from="330" to="-10" dur="7s" begin="-3.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" begin="-3.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- glitch title -->
  <g font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="56" font-weight="800" text-anchor="middle">
    <text x="500" y="135" fill="#22d3ee" opacity="0.7">Dimas Yuda Pratama
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;5 -1;-4 1;0 0;0 0" keyTimes="0;0.78;0.8;0.83;0.85;1" calcMode="discrete" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="135" fill="#f43f5e" opacity="0.7">Dimas Yuda Pratama
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-5 1;4 -1;0 0;0 0" keyTimes="0;0.78;0.8;0.83;0.85;1" calcMode="discrete" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="135" fill="url(#ttl)">Dimas Yuda Pratama</text>
  </g>

  <!-- typing subtitle -->
  <g clip-path="url(#typeclip)">
    <text x="352" y="193" font-family="'Courier New', Consolas, monospace" font-size="24" fill="#cbd5e1">&gt; 404: Feeling Not Found</text>
  </g>
  <rect x="352" y="172" width="12" height="26" fill="#2dd4bf">
    <animate attributeName="x" values="352;652;652;352" keyTimes="0;0.3;0.88;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- scanning line -->
  <rect x="0" y="0" width="1000" height="2" fill="#2dd4bf" opacity="0.25">
    <animate attributeName="y" from="0" to="320" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- waves -->
  <path d="M0 262 Q125 232 250 262 T500 262 T750 262 T1000 262 T1250 262 T1500 262 T1750 262 T2000 262 V320 H0 Z" fill="url(#w3)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="9s" repeatCount="indefinite"/>
  </path>
  <path d="M0 272 Q250 236 500 272 T1000 272 T1500 272 T2000 272 T2500 272 V320 H0 Z" fill="url(#w2)">
    <animateTransform attributeName="transform" type="translate" from="-1000 0" to="0 0" dur="12s" repeatCount="indefinite"/>
  </path>
  <path d="M0 282 Q125 258 250 282 T500 282 T750 282 T1000 282 T1250 282 T1500 282 T1750 282 T2000 282 V320 H0 Z" fill="url(#w1)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="6s" repeatCount="indefinite"/>
  </path>
</svg>
