<svg width="900" height="24" viewBox="0 0 900 24" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <line x1="0" y1="12" x2="900" y2="12" stroke="url(#dg)" stroke-width="2"/>
  <line x1="0" y1="12" x2="900" y2="12" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="6 14" opacity="0.6">
    <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <circle cy="12" r="5" fill="#f472b6" filter="url(#g)">
    <animate attributeName="cx" values="0;900;0" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cy="12" r="3" fill="#fff">
    <animate attributeName="cx" values="0;900;0" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
